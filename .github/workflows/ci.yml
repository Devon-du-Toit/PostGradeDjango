name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install -r requirements-dev.txt

      - name: Check code
        run: ruff check .

      - name: Check formatting
        # Non-blocking until the one-off project-wide format pass after the
        # open PRs merge; reformatting now would conflict with all of them.
        continue-on-error: true
        run: ruff format --check .

  unit:
    name: Unit tests (fast, mocked)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: postgrade
          POSTGRES_USER: postgrade_user
          POSTGRES_PASSWORD: postgrade
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SECRET_KEY: ci-test-secret-not-for-production
      DEBUG: "True"
      DB_NAME: postgrade
      DB_USER: postgrade_user
      DB_PASSWORD: postgrade
      DB_HOST: localhost
      DB_PORT: "5432"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Django system check
        run: python manage.py check

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Run fast unit tests
        run: |
          python manage.py test \
            submissions.tests.test_emailing \
            submissions.tests.test_submissions \
            submissions.tests.test_verification

  integration:
    name: Integration tests (OCR / OpenCV)
    runs-on: ubuntu-latest
    needs: unit

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: postgrade
          POSTGRES_USER: postgrade_user
          POSTGRES_PASSWORD: postgrade
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SECRET_KEY: ci-test-secret-not-for-production
      DEBUG: "True"
      DB_NAME: postgrade
      DB_USER: postgrade_user
      DB_PASSWORD: postgrade
      DB_HOST: localhost
      DB_PORT: "5432"
      PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK: "True"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Cache PaddleOCR models
        uses: actions/cache@v4
        with:
          path: ~/.paddlex
          key: paddlex-models-v1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run OCR integration tests
        run: |
          python manage.py test \
            submissions.tests.test_recognition_document \
            submissions.tests.test_recognition_matching \
            submissions.tests.test_recognition_service \
            submissions.tests.test_student_number_localization
